[package]
name = "sql-mcp-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", features = ["json", "macros", "tokio"] }
bigdecimal = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", features = ["bigdecimal", "chrono", "macros", "migrate", "mysql", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v7"] }
zeroize = "1"
vault-broker = { path = "../vault-broker" }

[dev-dependencies]
axum = { version = "0.8", features = ["json", "macros", "tokio"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
